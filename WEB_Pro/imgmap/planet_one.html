<!DOCTYPE html>
<html>
<head>
    <title>The Earth</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 40px auto;
            text-align: center;
            color: black;
        }

        .circle-cutout {
            width: 156px;  
            height: 156px; 
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            border: 4px solid #48cae4; /* Tweaked border color to fit Earth */
            box-shadow: 0 0 20px rgba(72, 202, 228, 0.5);
            margin: 20px auto;
        }

        .circle-cutout img {
            position: absolute;
            left: -124px; 
            top: -135px;  
        }

        h1 { color: #48cae4; } /* Beautiful earth-sky blue color */
    </style>
</head>
<body>
    <!-- Updated Title Header Here -->
    <h1>Earth</h1>
    
    <div class="circle-cutout">
        <img src="solar_system.jpg" alt="Earth Cutout" width="600" height="400">
    </div>

    <!-- Updated Description Paragraph Here -->
    <p style="max-width: 500px; margin: 20px auto; line-height: 1.6;">
        Our home planet is the third world from the Sun and the only known place in the universe inhabited by living organisms. It features sprawling liquid oceans and a protective atmosphere.
    </p>
</body>
</html>
