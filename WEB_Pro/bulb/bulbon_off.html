<!DOCTYPE html>
<html>
<head>
  <title>Bulb ON OFF</title>
</head>
<body>

  <h2>Turn ON/OFF Bulb Using JavaScript</h2>
  <img id="bulb" src="bulboff.jpg" width="150">

  <br><br>

  <button onclick="turnOn()">ON</button>
  <button onclick="turnOff()">OFF</button>

  <script>
    function turnOn() {
      document.getElementById("bulb").src = "bulbon.jpeg";
    }

    function turnOff() {
      document.getElementById("bulb").src = "bulboff.jpg";
    }
  </script>

</body>
</html>
