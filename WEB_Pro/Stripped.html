<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup All-Time Top Scorers</title>
    <style>

        #employee-table {
            width: 100%;                  
            border-collapse: collapse;    
            font-family: Arial, sans-serif; 
            margin: 20px 0;
        }


        #employee-table th {
            padding: 12px;                
            text-align: left;             
            background-color: #1f3a52;    
            color: white;
            border: 1px solid #dddddd;    
        }


        #employee-table td {
            padding: 12px;                
            border: 1px solid #dddddd;    
        }


        #employee-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }


        #employee-table tbody tr:hover {
            background-color: #e6f2ff;
        }
    </style>
</head>
<body>

    <h2>FIFA World Cup: All-Time Top Goalscorers</h2>


    <table id="employee-table">
        <thead>
            
            
            <tr>
                <th>Player</th>
                <th>Country</th>
                <th>World Cup Goals</th>
            </tr>
        </thead>
        <tbody>
        
            <tr>
                <td>Lionel Messi</td>
                <td>Argentina</td>
                <td>20</td>
            </tr>
            
            <tr>
                <td>Miroslav Klose</td>
                <td>Germany</td>
                <td>16</td>
            </tr>
            <tr>
                <td>Ronaldo</td>
                <td>Brazil</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Gerd Müller</td>
                <td>Germany</td>
                <td>14</td>
            </tr>
            <tr>
                <td>Just Fontaine</td>
                <td>France</td>
                <td>13</td>
            </tr>
            
        </tbody>
    </table>

</body>
</html>
